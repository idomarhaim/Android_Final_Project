<!doctype html>
<!--
  PROTOTYPE — GoalPilot in-app calendar surface (C9b, issue #26).
  THROWAWAY. Not app code. ?variant=A|B|C · ?lang=he|en · ?view=1|3|7 (A only)

  Rev 3 — Ido's second review, 2026-08-10:
    A  block times were CLIPPED and, in Hebrew, REORDERED by the bidi algorithm.
       Times are now bidi-isolated and stacked start-over-end in week view.
    A  the real cause: 7 columns on a 390px phone = 46px/day, which no Hebrew
       title survives. A now has a day / 3-day / week switch, defaulting to
       3-day — which is also #26's "which view opens by default".
    *  craft pass: tabular figures, sticky blurred headers, tonal weekend and
       today columns, a live now-pill, staggered entry, expressive nav.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — GoalPilot calendar surface (C9b / #26)</title>
<style>
  :root{
    --bg:#D0E2F5;
    --s-lowest:#FFFFFF; --s-low:#F5FAFF; --s:#EAF1FB; --s-high:#E1EBF7; --s-highest:#D7E3F1;
    --s-dim:#B8CBDF;
    --primary:#0A56C4; --on-primary:#fff; --p-container:#D8E2FF; --on-p-container:#001A41;
    --secondary:#0A6045; --s-container:#A8F2D3;
    --error:#B3261E; --late:#9A3412; --late-container:#FFE7D6;
    --on-surface:#0E161E; --on-surface-var:#44515F; --outline:#7A8797; --outline-var:#C6D4E4;
    --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:30px;
    --sh-1:0 1px 2px rgba(10,30,60,.06), 0 2px 8px rgba(10,30,60,.05);
    --sh-2:0 2px 6px rgba(10,30,60,.07), 0 12px 30px rgba(10,30,60,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 680px at 50% -12%, #22303f 0%, #131a23 60%);
    color:#dbe6f2;min-height:100vh;
    font-family:'Inter','Segoe UI Variable Text','Segoe UI',Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 12px 130px;
  }
  /* tabular figures everywhere a time or a date appears — proportional digits
     make a column of times visibly ragged, and it is the cheapest craft win there is */
  .num,.when,.hours,.dayhdr,.statusbar,.ev .tm{font-variant-numeric:tabular-nums}
  /* a Latin/■digit run inside an RTL paragraph gets REORDERED by the bidi algorithm:
     "09:00–12:00" renders as "12:00–09:00". Isolating it is the fix, not a hack. */
  .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  svg{display:block}
  .i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;
     stroke-linecap:round;stroke-linejoin:round;flex:none}

  .banner{max-width:770px;text-align:center}
  .banner h1{margin:0 0 5px;font-size:14.5px;font-weight:600;color:#eaf2fb}
  .banner p{margin:0;font-size:12.5px;line-height:1.55;color:#93a7bd}
  .banner code{background:#0b1219;padding:1.5px 6px;border-radius:5px;font-size:11.5px;color:#b9cde2}
  .banner a{color:#7dd3fc}

  .phone{
    width:392px;height:848px;border-radius:46px;background:var(--bg);border:10px solid #04080c;
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 30px 70px rgba(0,0,0,.62);
    overflow:hidden;position:relative;color:var(--on-surface);display:flex;flex-direction:column;
    animation:in .34s cubic-bezier(.2,.85,.25,1);
  }
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.993)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .statusbar{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;
             padding:0 24px;font-size:12.5px;font-weight:650;letter-spacing:.01em}
  .statusbar .rt{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600}

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;
    background:
      radial-gradient(560px 300px at 8% 0%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(460px 320px at 96% 14%, rgba(168,242,211,.20), transparent 62%);
  }
  .screen::-webkit-scrollbar{width:0}
  /* real calendars pin their header; blur only earns its keep when content
     actually travels underneath, which is why the bar lives inside the scroller */
  .sticky{position:sticky;top:0;z-index:20;
    background:linear-gradient(to bottom, rgba(208,226,245,.94), rgba(208,226,245,.82));
    backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
    box-shadow:0 1px 0 rgba(10,30,60,.07)}

  .appbar{padding:2px 18px 12px;display:flex;align-items:flex-start;gap:10px}
  .appbar .ttl{font-size:29px;font-weight:680;letter-spacing:-.032em;line-height:1.1}
  .appbar .sub{font-size:12.5px;color:var(--on-surface-var);margin-top:3px;font-weight:500}
  .appbar .spacer{flex:1}
  .iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
           background:var(--s-low);color:var(--on-surface-var);font-size:20px;flex:none;
           box-shadow:var(--sh-1)}
  .iconbtn.accent{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 14px rgba(10,86,196,.35)}

  .navbar{flex:none;height:80px;background:rgba(245,250,255,.92);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;align-items:flex-start;justify-content:space-around;padding-top:12px;
    box-shadow:0 -1px 0 rgba(10,30,60,.06)}
  .navbar .t{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;
             font-size:11px;font-weight:560;color:var(--on-surface-var)}
  .navbar .t .pill{padding:0 20px;height:33px;border-radius:17px;font-size:22px;display:grid;
                   place-items:center;transition:all .26s cubic-bezier(.2,.9,.2,1)}
  .navbar .t.on{color:var(--on-p-container);font-weight:680}
  .navbar .t.on .pill{background:var(--p-container);color:var(--on-p-container);
                      box-shadow:0 3px 10px rgba(10,86,196,.16)}
  .navbar .t.new .pill{box-shadow:0 0 0 2px #C2410C,0 0 0 5px rgba(194,65,12,.16)}

  .card{background:var(--s-low);border-radius:var(--r-lg);padding:15px 16px;margin:0 14px 12px;
        box-shadow:var(--sh-1)}
  .sect{font-size:11.5px;font-weight:680;letter-spacing:.06em;text-transform:uppercase;
        color:var(--on-surface-var);margin:10px 18px 9px}
  .muted{color:var(--on-surface-var);font-size:12.5px;line-height:1.5}
  .area{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3.5px 11px 3.5px 9px;
        font-size:11.5px;font-weight:650;white-space:nowrap}
  .area i{width:7px;height:7px;border-radius:50%;flex:none}
  .tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3.5px 10px;
       font-size:11px;font-weight:680;white-space:nowrap}
  .btn{border:0;border-radius:999px;padding:14px 22px;font-size:14.5px;font-weight:650;
       background:var(--primary);color:var(--on-primary);font-family:inherit;cursor:default;
       display:inline-flex;align-items:center;justify-content:center;gap:8px;
       box-shadow:0 4px 14px rgba(10,86,196,.28)}
  .btn.tonal{background:var(--p-container);color:var(--on-p-container);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--outline-var)}
  .btn.sm{padding:9px 16px;font-size:12.5px}

  /* segmented control — used by A (view) and B (list/agenda) */
  .seg{display:flex;background:var(--s-highest);border-radius:999px;padding:4px;flex:none}
  .seg span{flex:1;text-align:center;font-size:12.5px;font-weight:650;padding:7px 0;border-radius:999px;
            color:var(--on-surface-var);cursor:pointer;transition:all .22s cubic-bezier(.2,.9,.2,1)}
  .seg span.on{background:var(--s-lowest);color:var(--primary);box-shadow:var(--sh-1)}

  /* ── A · grid ─────────────────────────────────────────────────────────── */
  .dayhdr{display:grid;padding:2px 10px 6px}
  .dayhdr .d{text-align:center;font-size:10.5px;font-weight:650;color:var(--on-surface-var)}
  .dayhdr .d b{display:block;font-size:16px;font-weight:680;color:var(--on-surface);
               width:31px;height:31px;line-height:31px;margin:3px auto 0;border-radius:50%;
               transition:all .25s}
  .dayhdr .d.today{color:var(--primary)}
  .dayhdr .d.today b{background:var(--primary);color:var(--on-primary);
                     box-shadow:0 4px 12px rgba(10,86,196,.34)}
  .banded{display:grid;gap:3px;padding:2px 10px 9px}
  .banded .lbl{font-size:9px;font-weight:650;color:var(--on-surface-var);align-self:center;
               text-align:center;line-height:1.2}
  .banded .slot{display:flex;flex-direction:column;gap:3px;min-height:18px}
  .band{font-size:10px;font-weight:650;padding:3.5px 7px;border-radius:7px;overflow:hidden;
        white-space:nowrap;text-overflow:ellipsis;line-height:1.15}
  .band.cap-s{border-start-start-radius:999px;border-end-start-radius:999px;padding-inline-start:10px}
  .band.cap-e{border-start-end-radius:999px;border-end-end-radius:999px}

  .grid{display:grid;position:relative;padding-inline-end:8px}
  .hours .h{height:56px;font-size:10px;font-weight:600;color:var(--on-surface-var);
            text-align:end;padding-inline-end:8px;transform:translateY(-6px)}
  .col{position:relative}
  .col::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:1px;
               background:var(--outline-var);opacity:.6}
  .col.weekend{background:rgba(184,203,223,.20)}
  .col.today{background:linear-gradient(to bottom, rgba(216,226,255,.55), rgba(216,226,255,.18))}
  .col .line{height:56px;box-shadow:inset 0 -1px 0 rgba(198,212,228,.75)}
  .ev{position:absolute;inset-inline:2px;border-radius:9px;overflow:hidden;
      padding:4px 5px 4px 8px;font-size:9.5px;line-height:1.3;animation:rise .3s both;
      box-shadow:var(--sh-1)}
  .ev::before{content:'';position:absolute;inset-block:4px;inset-inline-start:2.5px;width:3px;
              border-radius:3px;background:currentColor}
  .ev b{display:block;font-size:10px;font-weight:680;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;letter-spacing:-.01em}
  .ev .tm{font-size:9px;font-weight:600;opacity:.85;white-space:nowrap;display:block}
  .ev.prov{border:1.6px dashed;background:transparent!important;box-shadow:none}
  .ev.gone{opacity:.48;box-shadow:none}
  .ev.gone b{text-decoration:line-through}
  .now{position:absolute;inset-inline:0;border-top:2px solid var(--error);z-index:6}
  .nowpill{position:absolute;z-index:7;transform:translateY(-50%);background:var(--error);color:#fff;
           font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;
           inset-inline-start:2px;box-shadow:0 3px 9px rgba(179,38,30,.4)}

  /* ── B · day rail ─────────────────────────────────────────────────────── */
  .rail{display:flex;gap:7px;padding:0 14px 13px;flex:none}
  .rail .p{flex:1;text-align:center;border-radius:var(--r-md);padding:8px 0 7px;background:var(--s-low);
           font-size:10.5px;font-weight:650;color:var(--on-surface-var);box-shadow:var(--sh-1);
           transition:all .24s cubic-bezier(.2,.9,.2,1)}
  .rail .p b{display:block;font-size:16.5px;font-weight:680;color:var(--on-surface);margin:3px 0 5px}
  .rail .p.on{background:var(--primary);box-shadow:0 5px 16px rgba(10,86,196,.34)}
  .rail .p.on,.rail .p.on b{color:var(--on-primary)}
  .rail .dots{display:flex;gap:3px;justify-content:center;height:5px}
  .rail .dots i{width:4.5px;height:4.5px;border-radius:50%;display:block}

  .agenda{padding:0 14px}
  .grouphd{font-size:11px;font-weight:680;letter-spacing:.05em;text-transform:uppercase;
           color:var(--on-surface-var);margin:14px 4px 9px;display:flex;align-items:center;gap:9px}
  .grouphd::after{content:'';flex:1;height:1px;background:var(--outline-var)}
  .row{display:flex;margin-bottom:9px;align-items:stretch;animation:rise .34s both}
  .when{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:3px;
        font-size:12.5px;font-weight:680;line-height:1.35;text-align:center}
  .when small{font-size:10.5px;font-weight:600;color:var(--on-surface-var)}
  .when .bar{width:4.5px;flex:1;border-radius:3px;margin:5px 0 2px;min-height:14px}
  .when .pt{width:10px;height:10px;border-radius:50%;margin:6px 0 2px;box-shadow:0 0 0 3.5px var(--bg)}
  .when .cap{width:4.5px;flex:1;border-radius:999px;margin:5px 0 2px;min-height:14px;opacity:.42}
  .body{flex:1;min-width:0;background:var(--s-low);border-radius:var(--r-md);padding:13px 15px;
        box-shadow:var(--sh-1)}
  .row.prov .body{background:transparent;border:1.6px dashed var(--primary);box-shadow:none}
  .row.band-row .body{border-radius:999px;padding:11px 19px}
  .body .t{font-size:15px;font-weight:640;line-height:1.3;letter-spacing:-.012em}
  .row.done .body .t{text-decoration:line-through;color:var(--on-surface-var)}
  .body .m{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tick{width:26px;height:26px;border-radius:9px;flex:none;align-self:center;margin-inline-start:11px;
        display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--outline);color:transparent}
  .tick.done{background:var(--secondary);box-shadow:0 3px 10px rgba(10,96,69,.3);color:#fff}

  /* ── C · decision stack ───────────────────────────────────────────────── */
  .hero{margin:0 14px 4px;position:relative}
  .hero .peek{position:absolute;inset-inline:13px;height:28px;border-radius:var(--r-xl);
              background:var(--s-high);top:-10px;z-index:0;box-shadow:var(--sh-1)}
  .hero .peek.b2{inset-inline:24px;top:-19px;background:var(--s-highest)}
  .deck{position:relative;z-index:1;border-radius:var(--r-xl);padding:20px 19px 17px;
        background:linear-gradient(158deg,#FFFFFF 0%,#F3F8FF 52%,#E9F1FF 100%);
        box-shadow:var(--sh-2);animation:rise .36s both}
  .deck .kicker{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
                letter-spacing:.05em;text-transform:uppercase;color:var(--primary)}
  .deck h3{margin:10px 0 5px;font-size:23px;font-weight:690;letter-spacing:-.03em;line-height:1.18}
  .deck .lede{font-size:13px;line-height:1.55;color:var(--on-surface-var)}
  .mini{margin-top:14px;border-radius:var(--r-md);background:rgba(215,227,241,.55);overflow:hidden}
  .mini .r{display:flex;align-items:center;gap:11px;padding:11px 13px}
  .mini .r+.r{box-shadow:inset 0 1px 0 rgba(198,212,228,.9)}
  .mini .cb{width:22px;height:22px;border-radius:8px;flex:none;display:grid;place-items:center;
            background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(10,86,196,.3)}
  .mini .cb.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline);color:transparent}
  .mini .tx{flex:1;min-width:0}
  .mini .tx b{display:block;font-size:13.5px;font-weight:640;line-height:1.25}
  .mini .tx span{font-size:11.5px;color:var(--on-surface-var)}
  .acts{display:flex;gap:9px;margin-top:16px}
  .acts .btn{flex:1}
  .skip{text-align:center;margin-top:12px;font-size:12.5px;font-weight:640;color:var(--on-surface-var)}
  .pips{display:flex;justify-content:center;gap:7px;padding:17px 0 8px}
  .pips i{width:7px;height:7px;border-radius:50%;background:var(--s-dim);display:block;transition:all .3s}
  .pips i.on{background:var(--primary);width:24px;border-radius:999px}
  .recap{margin:6px 14px 12px;background:var(--s-low);border-radius:var(--r-lg);padding:14px 16px;
         display:flex;align-items:center;gap:14px;box-shadow:var(--sh-1)}
  .recap .n{font-size:21px;font-weight:720;line-height:1;letter-spacing:-.02em}
  .recap .sep{width:1px;align-self:stretch;background:var(--outline-var)}
  .recap .u{font-size:11px;font-weight:640;color:var(--on-surface-var);margin-top:4px}
  .toweek{margin:0 14px 18px;text-align:center;font-size:13.5px;font-weight:640;color:var(--primary);
          padding:14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--outline-var)}

  .switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;
    display:flex;align-items:center;gap:2px;background:#f8fafc;color:#0f172a;
    border-radius:999px;padding:6px;box-shadow:0 12px 38px rgba(0,0,0,.58)}
  .switcher button{border:0;background:transparent;font:inherit;font-size:17px;cursor:pointer;
    width:36px;height:34px;border-radius:999px;color:#0f172a}
  .switcher button:hover{background:#e2e8f0}
  .switcher .lab{padding:0 14px;font-size:13px;font-weight:700;white-space:nowrap;min-width:206px;
    text-align:center;letter-spacing:-.012em}
  .switcher .lab small{display:block;font-weight:500;font-size:10.5px;color:#64748b}
  .switcher .lang{border-inline-start:1px solid #cbd5e1;padding-inline-start:6px;margin-inline-start:4px;
    display:flex;gap:2px}
  .switcher .lang button{width:auto;padding:0 11px;font-size:12px;font-weight:700;color:#64748b}
  .switcher .lang button.on{background:#0f172a;color:#fff}
</style>
</head>
<body>

<div class="banner">
  <h1>PROTOTYPE · <code>C9b</code> — the in-app calendar surface (<a href="https://github.com/idomarhaim/Android_Final_Project/issues/26">#26</a>)</h1>
  <p>Three answers to <em>what a calendar is for in this app</em> — same week, same twelve occurrences.
     <code>←</code> <code>→</code> cycle · <b>HE</b> flips to RTL · in <b>A</b>, tap <b>day / 3 / week</b>.
     Throwaway; nothing here ships.</p>
</div>

<div id="stage"></div>

<div class="switcher">
  <button id="prev" title="Previous">‹</button>
  <span class="lab" id="lab"></span>
  <button id="next" title="Next">›</button>
  <span class="lang"><button data-lang="en">EN</button><button data-lang="he">HE</button></span>
</div>

<script>
const svg = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const ICON = {
  home:  svg('<path d="M3.5 11 12 3.6 20.5 11v8.4a1 1 0 0 1-1 1h-4.4v-5.6H8.9v5.6H4.5a1 1 0 0 1-1-1z"/>'),
  goals: svg('<path d="M6.4 21V3.6h11.2l-3 4.2 3 4.2H6.4"/>'),
  social:svg('<path d="M7.4 4h9.2v4.6a4.6 4.6 0 0 1-9.2 0zM7.4 5.2H4.6v1.6a3 3 0 0 0 2.8 3M16.6 5.2h2.8v1.6a3 3 0 0 1-2.8 3M12 13.2v4.2M8.4 20h7.2"/>'),
  person:svg('<circle cx="12" cy="8" r="3.9"/><path d="M4.4 20.2a7.6 7.6 0 0 1 15.2 0"/>'),
  cal:   svg('<rect x="3.6" y="5.2" width="16.8" height="15.2" rx="3"/><path d="M8 3.2v3.6M16 3.2v3.6M3.6 10.2h16.8"/>'),
  search:svg('<circle cx="11" cy="11" r="6.8"/><path d="M16.2 16.2 21 21"/>'),
  plus:  svg('<path d="M12 5.4v13.2M5.4 12h13.2"/>'),
  check: svg('<path d="M5 12.4 9.6 17 19 7.4"/>'),
  spark: svg('<path d="M12 3.4l1.9 4.7 4.7 1.9-4.7 1.9L12 16.6l-1.9-4.7-4.7-1.9 4.7-1.9zM18.4 15.6l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>'),
  alert: svg('<circle cx="12" cy="12" r="8.6"/><path d="M12 7.6v5M12 16.1h.01"/>'),
};
const SYS = `<svg viewBox="0 0 46 14" style="height:11px;width:36px;fill:currentColor">
  <rect x="0" y="9" width="3" height="5" rx="1"/><rect x="4.5" y="6.5" width="3" height="7.5" rx="1"/>
  <rect x="9" y="4" width="3" height="10" rx="1"/><rect x="13.5" y="1.5" width="3" height="12.5" rx="1"/>
  <path d="M25.5 4.2a7.6 7.6 0 0 1 8.6 0l-1.5 1.9a5.2 5.2 0 0 0-5.6 0zm2.2 3.1a4 4 0 0 1 4.2 0l-2.1 2.7z"/>
  <rect x="37" y="3" width="8" height="9" rx="2" opacity=".45"/><rect x="38" y="4" width="6" height="7" rx="1.2"/></svg>`;

const CAT = {
  HEALTH:  {he:'בריאות',    en:'Health',  c:'#CF3636'},
  FITNESS: {he:'אימון ריצה',en:'Running', c:'#B85107'},
  LEARNING:{he:'לימודים',   en:'Studies', c:'#8B39C4'},
  CAREER:  {he:'קריירה',    en:'Career',  c:'#0F6FCB'},
};
const OCC = [
  {d:0,rung:'BLOCK',   s:360, e:420, cat:'FITNESS', st:'DONE',       he:'ריצה 5 ק״מ',       en:'Run 5 km'},
  {d:0,rung:'BLOCK',   s:1200,e:1230,cat:'LEARNING',st:'EXPIRED',    he:'לקרוא פרק',        en:'Read a chapter'},
  {d:0,rung:'DEADLINE',s:1439,       cat:'LEARNING',st:'OVERDUE',    he:'תשלום שכר לימוד',  en:'Pay tuition'},
  {d:1,rung:'SPAN',  until:5,        cat:'LEARNING',st:'CONFIRMED',  he:'שבוע מבחנים',      en:'Exam week'},
  {d:1,rung:'ALL_DAY',              cat:'HEALTH',  st:'CONFIRMED',   he:'יום ללא סוכר',     en:'No-sugar day'},
  {d:1,rung:'BLOCK',   s:360, e:420, cat:'FITNESS', st:'MISSED',     he:'ריצה 5 ק״מ',       en:'Run 5 km'},
  {d:1,rung:'BLOCK',   s:540, e:660, cat:'LEARNING',st:'PROVISIONAL',he:'תרגול אלגוריתמים', en:'Algorithms practice'},
  {d:1,rung:'BLOCK',   s:1020,e:1110,cat:'CAREER',  st:'PROVISIONAL',he:'הכנה לראיון',      en:'Interview prep'},
  {d:1,rung:'DEADLINE',s:1439,       cat:'LEARNING',st:'CONFIRMED',  he:'הגשת תרגיל 3',     en:'Submit exercise 3'},
  {d:2,rung:'BLOCK',   s:360, e:420, cat:'FITNESS', st:'CONFIRMED',  he:'ריצה 8 ק״מ',       en:'Run 8 km'},
  {d:3,rung:'BLOCK',   s:540, e:720, cat:'LEARNING',st:'CONFIRMED',  he:'מבחן מערכות הפעלה',en:'OS exam'},
  {d:4,rung:'BLOCK',   s:840, e:900, cat:'CAREER',  st:'CONFIRMED',  he:'ראיון עבודה',      en:'Job interview'},
  {d:4,rung:'BLOCK',   s:360, e:420, cat:'FITNESS', st:'PROVISIONAL',he:'ריצה קלה',         en:'Easy run'},
  {d:6,rung:'BLOCK',   s:1080,e:1140,cat:'FITNESS', st:'PROVISIONAL',he:'ריצה ארוכה 12 ק״מ',en:'Long run 12 km'},
];
const CHALLENGE = {from:0, until:6, he:'אתגר · 10,000 צעדים ביום', en:'Challenge · 10k steps a day', c:'#0A6045'};

const T = {
  he:{home:'בית',goals:'מטרות',social:'חברתי',profile:'פרופיל',cal:'לוח שנה',
      allday:'כל היום',today:'היום',list:'רשימה',agenda:'סדר יום',
      vDay:'יום',v3:'3 ימים',vWeek:'שבוע',
      due:'עד',prov:'הצעה',missed:'פוספס',late:'באיחור · עדיין פתוח',done:'הושלם',
      review:'סיכום היום',plan:'תכנן את מחר →',toweek:'לוח השבוע המלא →',
      decisions:'ממתין להחלטה',confirm:'אשר הכול',later:'אחר כך',resched:'תזמון מחדש',
      skip:'דלג על ההחלטה הזו',now:'עכשיו',
      morning:'בוקר',afternoon:'צהריים ואחה״צ',evening:'ערב',allDayHd:'לאורך היום',
      agentTitle:n=>`הסוכן תכנן ${n===1?'בלוק אחד':n+' בלוקים'} לשבוע הקרוב`,
      agentLede:'שום דבר לא נכתב ליומן שלך עד שתאשר. אפשר לבטל סימון של כל אחד מהם.',
      hint:'לחיצה ארוכה גוררת בלוק לשעה אחרת'},
  en:{home:'Home',goals:'Goals',social:'Social',profile:'Profile',cal:'Calendar',
      allday:'All-day',today:'Today',list:'List',agenda:'Agenda',
      vDay:'Day',v3:'3 days',vWeek:'Week',
      due:'due',prov:'proposed',missed:'missed',late:'late · still owed',done:'done',
      review:'Your day',plan:'Plan tomorrow →',toweek:'Open the full week →',
      decisions:'Waiting on you',confirm:'Confirm all',later:'Later',resched:'Reschedule',
      skip:'Skip this decision',now:'now',
      morning:'Morning',afternoon:'Afternoon',evening:'Evening',allDayHd:'Across the day',
      agentTitle:n=>`The agent planned ${n===1?'1 block':n+' blocks'} for the week`,
      agentLede:'Nothing reaches your Google calendar until you confirm. Untick any of them.',
      hint:'long-press drags a block to another hour'},
};

const TODAY = new Date(2026,7,10);
const SUNDAY = new Date(TODAY); SUNDAY.setDate(TODAY.getDate()-TODAY.getDay());
const TODAY_IDX = TODAY.getDay();
const NOW_MIN = 20*60+10, H0 = 5, H1 = 23, ROW = 56;

const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
/* every time string goes through here — see .ltr, the bidi isolation */
const time = m => `<span class="ltr">${hhmm(m)}</span>`;
const range = (a,b) => `<span class="ltr">${hhmm(a)}–${hhmm(b)}</span>`;
const dayDate = i => { const d=new Date(SUNDAY); d.setDate(SUNDAY.getDate()+i); return d; };
const dayName = (i,l) => new Intl.DateTimeFormat(l==='he'?'he-IL':'en-GB',{weekday:'short'}).format(dayDate(i));
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const tint = (h,a) => `rgba(${rgb(h).join(',')},${a})`;
const areaChip = (o,l) => `<span class="area" style="background:${tint(CAT[o.cat].c,.13)};color:${CAT[o.cat].c}">
  <i style="background:${CAT[o.cat].c}"></i>${esc(CAT[o.cat][l])}</span>`;

function phone(lang,{tabs,active,newTab,sticky,body}){
  const t = T[lang];
  const TABS = tabs || [[ICON.home,t.home],[ICON.goals,t.goals],[ICON.social,t.social],[ICON.person,t.profile]];
  return `<div class="phone" dir="${lang==='he'?'rtl':'ltr'}" lang="${lang}">
    <div class="statusbar"><span>${hhmm(NOW_MIN)}</span><span class="rt">${SYS}<span>84%</span></span></div>
    <div class="screen"><div class="sticky">${sticky}</div>${body}</div>
    <div class="navbar">${TABS.map((x,i)=>
      `<div class="t ${i===active?'on':''} ${i===newTab?'new':''}">
         <span class="pill">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div></div>`;
}

/* ═══ A — THE GRID ═══
   Ido: the times inside a block were clipped. Two causes, both fixed:
   (1) bidi reordered "09:00–12:00" into "12:00–09:00" in Hebrew  -> .ltr isolation
   (2) 7 columns on a 390px phone is 46px/day, which no title survives
       -> a day / 3-day / week switch, defaulting to 3 days.
   In week view the times stack start-over-end, exactly as he suggested. */
function variantA(lang, view){
  const t = T[lang];
  const days = view===1 ? [TODAY_IDX]
             : view===3 ? [0,1,2].map(k=>Math.min(4,Math.max(0,TODAY_IDX-1))+k)
             : [0,1,2,3,4,5,6];
  const tight = days.length===7;                       // the cramped case
  const cols = `grid-template-columns:44px repeat(${days.length},1fr)`;

  let hours=''; for(let h=H0;h<=H1;h++) hours += `<div class="h">${String(h).padStart(2,'0')}:00</div>`;

  const colHtml = days.map((d,n)=>{
    let lines=''; for(let i=0;i<H1-H0;i++) lines += '<div class="line"></div>';
    const evs = OCC.filter(o=>o.d===d && o.rung==='BLOCK').map((o,k)=>{
      const top=((o.s-H0*60)/60)*ROW, h=((o.e-o.s)/60)*ROW, c=CAT[o.cat].c;
      const prov=o.st==='PROVISIONAL'||o.st==='EXPIRED', gone=o.st==='MISSED'||o.st==='EXPIRED';
      const style = prov ? `top:${top}px;height:${h-2}px;color:${c};border-color:${c};animation-delay:${k*40}ms`
                         : `top:${top}px;height:${h-2}px;color:${c};background:${tint(c,.17)};animation-delay:${k*40}ms`;
      const times = tight
        ? `<span class="tm">${time(o.s)}</span><span class="tm">${time(o.e)}</span>`
        : `<span class="tm">${range(o.s,o.e)}</span>`;
      return `<div class="ev ${prov?'prov':''} ${gone?'gone':''}" style="${style}">
        <b>${esc(o[lang])}</b>${h>=34?times:''}</div>`;
    }).join('');
    const isToday = d===TODAY_IDX, weekend = d===5||d===6;
    const now = isToday ? `<div class="now" style="top:${((NOW_MIN-H0*60)/60)*ROW}px"></div>` : '';
    return `<div class="col ${isToday?'today':''} ${weekend?'weekend':''}">${lines}${evs}${now}</div>`;
  }).join('');

  const nowPill = days.includes(TODAY_IDX)
    ? `<div class="nowpill" style="top:${((NOW_MIN-H0*60)/60)*ROW}px">${time(NOW_MIN)}</div>` : '';

  let hdr='<div></div>';
  days.forEach(d=> hdr += `<div class="d ${d===TODAY_IDX?'today':''}">${dayName(d,lang)}<b>${dayDate(d).getDate()}</b></div>`);

  let bands = `<div class="lbl">${t.allday}</div>`;
  days.forEach(d=>{
    let here='';
    const capsule=(o,c,label)=>{
      const start=d===o.d, end=d===(o.until ?? o.d);
      return `<div class="band ${start?'cap-s':''} ${end?'cap-e':''}"
        style="background:${tint(c,.2)};color:${c}">${start?esc(label):'&nbsp;'}</div>`;
    };
    if(d>=CHALLENGE.from&&d<=CHALLENGE.until) here+=capsule({d:CHALLENGE.from,until:CHALLENGE.until},CHALLENGE.c,CHALLENGE[lang]);
    OCC.filter(o=>o.rung==='SPAN'&&d>=o.d&&d<=o.until).forEach(o=>here+=capsule(o,CAT[o.cat].c,o[lang]));
    OCC.filter(o=>o.d===d&&o.rung==='ALL_DAY').forEach(o=>
      here+=`<div class="band" style="background:${tint(CAT[o.cat].c,.2)};color:${CAT[o.cat].c}">${esc(o[lang])}</div>`);
    OCC.filter(o=>o.d===d&&o.rung==='DEADLINE').forEach(o=>{
      const late=o.st==='OVERDUE', c=late?'#9A3412':CAT[o.cat].c;
      here+=`<div class="band" style="background:${late?'var(--late-container)':tint(c,.2)};color:${c}">
        ${t.due} ${time(o.s)} · ${esc(o[lang])}</div>`;
    });
    bands += `<div class="slot">${here}</div>`;
  });

  const month = new Intl.DateTimeFormat(lang==='he'?'he-IL':'en-GB',{month:'long'}).format(TODAY);
  const sticky = `<div class="appbar">
      <div><div class="ttl">${t.cal}</div>
        <div class="sub num">${dayDate(days[0]).getDate()}–${dayDate(days[days.length-1]).getDate()} ${month}</div></div>
      <div class="spacer"></div>
      <div class="iconbtn">${ICON.search}</div><div class="iconbtn accent">${ICON.plus}</div></div>
    <div class="seg" style="margin:0 18px 11px">
      <span data-view="1" class="${view===1?'on':''}">${t.vDay}</span>
      <span data-view="3" class="${view===3?'on':''}">${t.v3}</span>
      <span data-view="7" class="${view===7?'on':''}">${t.vWeek}</span></div>
    <div class="dayhdr" style="${cols}">${hdr}</div>
    <div class="banded" style="${cols}">${bands}</div>`;

  return phone(lang,{active:2,newTab:2,
    tabs:[[ICON.home,t.home],[ICON.goals,t.goals],[ICON.cal,t.cal],[ICON.social,t.social],[ICON.person,t.profile]],
    sticky,
    body:`<div class="grid" style="${cols}"><div class="hours">${hours}</div>${colHtml}${nowPill}</div>
          <div class="muted" style="padding:14px 16px 22px;text-align:center">${t.hint}</div>`});
}

/* ═══ B — THE DAY RAIL ═══ */
function variantB(lang){
  const t = T[lang], sel = TODAY_IDX;
  let rail='';
  for(let d=0;d<7;d++){
    const dots = OCC.filter(o=>o.d===d).slice(0,4)
      .map(o=>`<i style="background:${d===sel?'rgba(255,255,255,.9)':CAT[o.cat].c}"></i>`).join('');
    rail += `<div class="p ${d===sel?'on':''}">${dayName(d,lang)}<b>${dayDate(d).getDate()}</b>
      <div class="dots">${dots}</div></div>`;
  }

  const rowOf = (o,i) => {
    const c = CAT[o.cat].c;
    const prov=o.st==='PROVISIONAL', done=o.st==='DONE', missed=o.st==='MISSED', late=o.st==='OVERDUE';
    let when;
    if(o.rung==='BLOCK')
      when = `${time(o.s)}<div class="bar" style="background:${prov?tint(c,.4):c}"></div><small>${time(o.e)}</small>`;
    else if(o.rung==='DEADLINE')
      when = `<small>${t.due}</small>${time(o.s)}<div class="pt" style="background:${late?'#9A3412':c}"></div>`;
    else if(o.rung==='SPAN')
      when = `<small class="ltr">${dayDate(o.d).getDate()}–${dayDate(o.until).getDate()}</small>
              <div class="cap" style="background:${c}"></div>`;
    else when = `<small>${t.allday}</small>`;
    const tags=[areaChip(o,lang)];
    if(prov)   tags.push(`<span class="tag" style="color:var(--primary);box-shadow:inset 0 0 0 1.4px var(--primary)">${ICON.spark}${t.prov}</span>`);
    if(missed) tags.push(`<span class="tag" style="background:var(--s-highest);color:var(--on-surface-var)">${t.missed}</span>`);
    if(late)   tags.push(`<span class="tag" style="background:var(--late-container);color:var(--late)">${ICON.alert}${t.late}</span>`);
    return `<div class="row ${prov?'prov':''} ${done?'done':''} ${o.rung==='ALL_DAY'||o.rung==='SPAN'?'band-row':''}"
      style="animation-delay:${i*45}ms">
      <div class="when">${when}</div>
      <div class="body"><div class="t">${esc(o[lang])}</div><div class="m">${tags.join('')}</div></div>
      <div class="tick ${done?'done':''}">${ICON.check}</div></div>`;
  };

  const here = OCC.filter(o=>o.d===sel || (o.rung==='SPAN'&&sel>o.d&&sel<=o.until))
                  .concat(OCC.filter(o=>o.st==='OVERDUE'&&o.d!==sel));
  /* grouping by part of day is what turns a flat list into something scannable */
  const groups = [
    [t.allDayHd,   here.filter(o=>o.rung==='ALL_DAY'||o.rung==='SPAN')],
    [t.morning,    here.filter(o=>o.rung==='BLOCK'&&o.s<12*60)],
    [t.afternoon,  here.filter(o=>o.rung==='BLOCK'&&o.s>=12*60&&o.s<17*60)],
    [t.evening,    here.filter(o=>(o.rung==='BLOCK'&&o.s>=17*60)||o.rung==='DEADLINE')],
  ];
  let n=0;
  const agenda = groups.filter(g=>g[1].length).map(([name,items])=>
    `<div class="grouphd">${name}</div>` +
    items.sort((a,b)=>(a.s||0)-(b.s||0)).map(o=>rowOf(o,n++)).join('')).join('');

  const sticky = `<div class="appbar">
      <div><div class="ttl">${t.goals}</div>
        <div class="sub">${t.today} · ${dayName(sel,lang)} <span class="num">${dayDate(sel).getDate()}</span></div></div>
      <div class="spacer"></div>
      <div class="iconbtn">${ICON.search}</div><div class="iconbtn accent">${ICON.plus}</div></div>
    <div class="seg" style="margin:0 14px 12px"><span>${t.list}</span><span class="on">${t.agenda}</span></div>
    <div class="rail">${rail}</div>`;

  return phone(lang,{active:1,sticky,
    body:`<div class="agenda">${agenda}</div>
      <div style="padding:14px 14px 22px"><button class="btn ghost" style="width:100%">${t.plan}</button></div>`});
}

/* ═══ C — THE DECISION STACK ═══ */
function variantC(lang){
  const t = T[lang];
  const props  = OCC.filter(o=>o.st==='PROVISIONAL');
  const done   = OCC.filter(o=>o.st==='DONE').length;
  const missed = OCC.filter(o=>o.st==='MISSED').length;
  const late   = OCC.filter(o=>o.st==='OVERDUE').length;

  const hero = `<div class="hero"><div class="peek b2"></div><div class="peek"></div>
    <div class="deck">
      <div class="kicker">${ICON.spark}${t.decisions} · <span class="num">1/3</span></div>
      <h3>${esc(t.agentTitle(props.length))}</h3>
      <div class="lede">${esc(t.agentLede)}</div>
      <div class="mini">${props.map((o,i)=>`<div class="r">
        <div class="cb ${i===2?'off':''}">${ICON.check}</div>
        <div class="tx"><b>${esc(o[lang])}</b>
          <span>${dayName(o.d,lang)} · ${range(o.s,o.e)} · ${esc(CAT[o.cat][lang])}</span></div>
        <span style="width:9px;height:9px;border-radius:50%;background:${CAT[o.cat].c};flex:none"></span>
      </div>`).join('')}</div>
      <div class="acts"><button class="btn">${ICON.check}${t.confirm}</button>
        <button class="btn ghost">${t.later}</button></div>
      <div class="skip">${t.skip}</div>
    </div></div>
    <div class="pips"><i class="on"></i><i></i><i></i></div>`;

  const recap = `<div class="recap">
      <div><div class="n" style="color:var(--secondary)">${done}</div><div class="u">${t.done}</div></div>
      <div class="sep"></div>
      <div><div class="n" style="color:var(--on-surface-var)">${missed}</div><div class="u">${t.missed}</div></div>
      <div class="sep"></div>
      <div><div class="n" style="color:var(--late)">${late}</div><div class="u">${t.late}</div></div>
      <div style="flex:1"></div><button class="btn tonal sm">${t.resched}</button></div>`;

  const sticky = `<div class="appbar">
      <div><div class="ttl">${t.home}</div>
        <div class="sub">${dayName(TODAY_IDX,lang)} · ${time(NOW_MIN)}</div></div>
      <div class="spacer"></div>
      <div class="iconbtn">${ICON.cal}</div><div class="iconbtn">${ICON.person}</div></div>`;

  return phone(lang,{active:0,sticky,
    body:`<div class="sect">${t.review}</div>${hero}${recap}<div class="toweek">${t.toweek}</div>`});
}

/* ═══ switcher ═══ */
const VARIANTS = [
  ['A','The Grid','place time',variantA],
  ['B','The Day Rail','tick things off',variantB],
  ['C','The Decision Stack','decide, one at a time',variantC],
];
function state(){
  const p = new URLSearchParams(location.search);
  let i = VARIANTS.findIndex(x=>x[0]===(p.get('variant')||'A').toUpperCase());
  const v = parseInt(p.get('view'),10);
  return [i<0?0:i, p.get('lang')==='he'?'he':'en', [1,3,7].includes(v)?v:3];
}
function go(i,lang,view){
  const p = new URLSearchParams(location.search);
  p.set('variant',VARIANTS[i][0]); p.set('lang',lang); p.set('view',view);
  history.replaceState(null,'',location.pathname+'?'+p); render();
}
function render(){
  const [i,lang,view] = state();
  document.getElementById('stage').innerHTML = VARIANTS[i][3](lang,view);
  document.getElementById('lab').innerHTML =
    `${VARIANTS[i][0]} — ${VARIANTS[i][1]}<small>${VARIANTS[i][2]}</small>`;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  document.querySelectorAll('[data-view]').forEach(s=>
    s.onclick = () => go(i, lang, parseInt(s.dataset.view,10)));
}
document.getElementById('prev').onclick = () => { const [i,l,v]=state(); go((i+2)%3,l,v); };
document.getElementById('next').onclick = () => { const [i,l,v]=state(); go((i+1)%3,l,v); };
document.querySelectorAll('.lang button').forEach(b=>
  b.onclick = () => { const [i,,v]=state(); go(i,b.dataset.lang,v); });
addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  const [i,l,v]=state();
  if(e.key==='ArrowLeft')  go((i+2)%3,l,v);
  if(e.key==='ArrowRight') go((i+1)%3,l,v);
});
render();
</script>
