[versions]
# ── Build tooling ──────────────────────────────────────────────────
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
googleServices = "4.4.2"

# ── AndroidX / Jetpack ─────────────────────────────────────────────
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"

# ── Glance (home-screen widgets, spec §4.5) ────────────────────────
# Glance is Compose-shaped but does NOT render Compose: it compiles a composable
# tree down to a RemoteViews, which the launcher inflates in its own process.
# That is why the widget pack draws its charts into bitmaps rather than reusing
# ui/components/ — there is no Canvas, no Modifier.blur and no animation on the
# other side of that boundary (§4.5). 1.1.1 is the current stable line and the
# newest that does not require an AGP bump; the toolchain constraint is the same
# one pinning Health Connect below.
glance = "1.1.1"

# -- WorkManager (#8's local scheduling, spec S2.5) -----------------
# Declared explicitly rather than ridden in through Glance, so a future widget
# bump cannot silently move the scheduler underneath us.
#
# Inferred: 2.9.1 rather than the 2.10 line, from the same toolchain constraint
# that pins Glance and Health Connect (compileSdk 35 / AGP 8.7.3), and because
# it is the line Glance 1.1.1 is built against. Untested: neither the version
# choice nor the resolved graph has been checked by a build -- the Gradle daemon
# was held by a sibling session when this landed. `gradlew :app:dependencies`
# is what settles it.
workManager = "2.9.1"

# ── DI ─────────────────────────────────────────────────────────────
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# ── Async ──────────────────────────────────────────────────────────
coroutines = "1.9.0"

# ── Firebase / Google ──────────────────────────────────────────────
firebaseBom = "33.7.0"
playServicesAuth = "21.3.0"
# App Distribution ships OUTSIDE the Firebase BoM — its Android SDK is still
# beta, so the BoM deliberately does not pin it and an explicit version is
# mandatory. `appDistributionPlugin` (build-time upload) and `appDistribution`
# (in-app update prompt) version independently of each other.
appDistributionPlugin = "5.3.0"
appDistribution = "16.0.0-beta20"

# ── Media / serialization ──────────────────────────────────────────
coil = "2.7.0"
kotlinxSerialization = "1.7.3"

# ── Health Connect ─────────────────────────────────────────────────
# PINNED BY THE TOOLCHAIN, not by preference. 1.1.0 is the first stable
# connect-client (there is no stable 1.0.0 — that line ends at alpha11), but
# 1.1.0 and 1.1.0-rc* both demand compileSdk 36 AND AGP 8.9.1+; this project is
# on compileSdk 35 / AGP 8.7.3 / Gradle 8.10.2. beta01 is the newest release
# that builds against the current toolchain, and the APIs used in
# data/health/HealthConnectManager.kt have been settled since 1.0.0-alpha.
# Moving to 1.1.0 means bumping AGP, the Gradle wrapper and compileSdk together
# — tracked in TODO/TODO_FUTURE/, deliberately not bundled into this feature.
healthConnect = "1.1.0-beta01"

# ── Security (C13's encrypted key store, #54 / decided in #32) ─────
# `androidx.security:security-crypto` is the artifact #32 §1 names by name, and
# it is the only new client-side dependency C13 creates.
#
# The alpha, not 1.0.0, and the choice is between two FROZEN artifacts rather
# than between stable and bleeding edge: Google deprecated this whole library in
# 2025 and shipped no replacement for a Keystore-backed SharedPreferences, so
# neither line will move again. 1.0.0's entry point is `MasterKeys.getOrCreate`,
# deprecated in favour of the `MasterKey.Builder` that only exists from
# 1.1.0-alpha; taking 1.0.0 means writing a call that is deprecated on arrival.
#
# Pre-release deps are not new here — Health Connect is on a beta and App
# Distribution on `-beta20`, both for the same shape of reason.
securityCrypto = "1.1.0-alpha06"

# ── Test ───────────────────────────────────────────────────────────
junit = "4.13.2"
mockk = "1.13.13"
turbine = "1.2.0"
truth = "1.4.4"
# 1.2.1 / 3.6.1 reflect on the private InputManager.getInstance(), which no longer
# exists on Android 15+ — every instrumented test died with NoSuchMethodException
# on an API 37 emulator. 1.3.0 / 3.7.0 drop that reflection.
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# AndroidX core / lifecycle / activity
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (versions come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt (DI)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Firebase (versions come from the BOM)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
firebase-functions = { group = "com.google.firebase", name = "firebase-functions" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# App Distribution — the api/impl split is load-bearing, not tidiness. The `-api`
# artifact is a no-op stub that ships in every variant so the call site compiles
# and does nothing; the full implementation is added to the *release* variant
# only. A build that never reaches a tester therefore carries no updater at all.
firebase-appdistribution-api = { group = "com.google.firebase", name = "firebase-appdistribution-api", version.ref = "appDistribution" }
firebase-appdistribution = { group = "com.google.firebase", name = "firebase-appdistribution", version.ref = "appDistribution" }

# Media / serialization
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Health Connect (fitness & sleep)
androidx-health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

# Glance (home-screen widgets)
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

# WorkManager (local notification scheduling)
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Security (C13's encrypted key store) — see the version note above
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Unit test
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Instrumented test
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-appdistribution = { id = "com.google.firebase.appdistribution", version.ref = "appDistributionPlugin" }
