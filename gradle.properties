# Gradle JVM options
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache is left off for maximum compatibility with the
# google-services + Hilt plugins on this toolchain.
org.gradle.configuration-cache=false

# Machine-specific: pin Gradle to JDK 21. The Android Gradle Plugin does
# not support the JDK 25 that is this machine's JAVA_HOME. Android Studio's
# bundled JBR (also JDK 21) works too. Adjust/remove on other machines.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
