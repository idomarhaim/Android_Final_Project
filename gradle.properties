# Gradle JVM options
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache is left off for maximum compatibility with the
# google-services + Hilt plugins on this toolchain.
org.gradle.configuration-cache=false

# Machine-specific: pin Gradle to JDK 21. The Android Gradle Plugin does
# not support the JDK 25 also installed here. Android Studio's bundled JBR
# (also JDK 21) works too. Adjust/remove on other machines.
#
# Repointed 2026-08-15 (social-share-bugs): this said jdk-21.0.11.10-hotspot,
# and that directory now holds nothing but an orphaned lib/ - no bin/java.exe.
# Gradle died with "JAVA_HOME is set to an invalid directory" before reading a
# single build file, and firestore-tests' emulator fell back to the JDK 17 on
# PATH and refused to start. The machine JAVA_HOME points at the same wreck, so
# set it too in any shell you build from. The pin itself is unchanged in intent:
# still JDK 21, just the copy of it that still exists.
# ASCII only on purpose - a .properties file is read as ISO-8859-1, so a UTF-8
# dash lands here as mojibake.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
